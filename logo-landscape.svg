<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" width="520" height="220" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&amp;family=Geist:wght@400;500;600&amp;display=swap');
      .brand-title {
        font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
        font-size: 68px;
        font-weight: 400;
        letter-spacing: 0.02em;
        fill: #f7f0e8;
        text-anchor: middle;
      }
      .brand-title-accent {
        fill: #dfc19b;
        font-style: italic;
      }
      .brand-tagline {
        font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 13.5px;
        font-weight: 500;
        letter-spacing: 0.3em;
        fill: #c5b8ac;
        text-transform: uppercase;
        text-anchor: middle;
      }
      .icon-stroke {
        stroke: #dfc19b;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .icon-fill {
        fill: #dfc19b;
      }
    </style>
  </defs>

  <!-- Pure Centered Vector Icon (Zero Background Box/Glow) -->
  <g id="icon-mark">
    <!-- Left Bracket -->
    <path d="M246 34 L232 48 L246 62" class="icon-stroke" stroke-width="3.2"/>
    <!-- Right Bracket -->
    <path d="M274 34 L288 48 L274 62" class="icon-stroke" stroke-width="3.2"/>
    <!-- Studio Axis -->
    <path d="M268 24 L252 72" class="icon-stroke" stroke-width="2.6"/>
    <!-- Core Spark -->
    <circle cx="260" cy="48" r="3.8" class="icon-fill"/>
  </g>

  <!-- Main Title: Cormorant Garamond 400 -->
  <text x="260" y="136" class="brand-title">Bio <tspan class="brand-title-accent">Studio</tspan></text>

  <!-- Subtitle: Geist 500 -->
  <text x="260" y="178" class="brand-tagline">JanitorAI Bio Design</text>
</svg>